version: 2
updates:
  - package-ecosystem: bundler
    directory: "/backend"
    schedule:
      interval: weekly
    groups:
      # One PR per week for non-breaking updates; major versions still get their own PR.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    groups:
      # These must stay on the same version (eslint-plugin-oxlint peers on oxlint).
      oxlint:
        patterns: [oxlint, eslint-plugin-oxlint]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node type definitions follow the Node version we run (frontend/.nvmrc); bump them together by hand.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7 isn't supported by typescript-eslint / vue-tsc yet. Remove once they support it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
