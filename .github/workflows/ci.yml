name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Install packages
        working-directory: .
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips

      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: backend
          bundler-cache: true

      - name: RuboCop
        run: bin/rubocop -f github

      - name: Brakeman
        run: bin/brakeman --no-pager --exit-on-warn --exit-on-error

      - name: Bundler audit
        run: bin/bundler-audit

      - name: Test
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare && bundle exec rspec

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: backend/coverage
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx eslint . && npx oxlint .
      - run: npm run build
      - run: npx vitest run

  devcontainer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate docker-dev compose file
        run: docker compose -f docker-dev/docker-compose.yml config --quiet

      - name: Build dev container
        run: USER_UID=$(id -u) bin/docker build app

      - name: Set up and run specs inside the dev container
        run: bin/docker run --rm app bash -c "../bin/setup && bin/rails db:test:prepare && bundle exec rspec"

      - name: Stop containers
        if: always()
        run: bin/docker down -v
