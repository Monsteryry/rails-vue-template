# RuboCop defaults plus the official Rails, Performance, RSpec and FactoryBot plugins.
# Adjust rules below to build your own house style: https://docs.rubocop.org/rubocop/configuration.html
plugins:
  - rubocop-rails
  - rubocop-performance
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-factory_bot

AllCops:
  NewCops: enable
  SuggestExtensions: false
  # TargetRubyVersion is read from .ruby-version.
  Exclude:
    - bin/**/*
    - db/*schema.rb
    - log/**/*
    - node_modules/**/*
    - storage/**/*
    - tmp/**/*
    - vendor/**/*

# Rails code commonly uses double quotes (matches the generators' output).
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Class-level doc comments are noise for controllers, models and jobs.
Style/Documentation:
  Enabled: false

# Rails' generated config files and short classes read better with a little more room.
Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Max: 15

Metrics/BlockLength:
  Exclude:
    - config/**/*

# Request specs often check status and body together.
RSpec/MultipleExpectations:
  Max: 3
